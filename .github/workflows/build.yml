name: Build LEDE for JDCloud BE6500

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-distutils rsync swig unzip \
            zlib1g-dev file wget libelf-dev bc cpio time gperf libtool-bin \
            pkg-config libpython3-dev

      - name: Clone LEDE
        run: git clone --depth 1 https://github.com/coolsnowwolf/lede.git lede

      - name: Update and install feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write build config
        working-directory: lede
        run: |
          cp ../config.seed .config
          make defconfig


      - name: Shrink kernel (fit 7 MiB HLOS)
        working-directory: lede
        run: |
          # 内核用 -Os、去调试信息、关 BPF，压缩到 7 MiB 以内
          sed -i 's/^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y$/# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set/; s/^# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set$/CONFIG_CC_OPTIMIZE_FOR_SIZE=y/' target/linux/generic/config-6.18
          sed -i '/^CONFIG_DEBUG_INFO=y$/d' target/linux/qualcommbe/config-6.18
          sed -i 's/^CONFIG_BPF_SYSCALL=y$/# CONFIG_BPF_SYSCALL is not set/' target/linux/generic/config-6.18
          grep -E 'CC_OPTIMIZE|BPF_SYSCALL' target/linux/generic/config-6.18

      - name: Download source archives
        working-directory: lede
        run: |
          make download -j8 || make download -j4 || make download -j1

      - name: Build firmware
        working-directory: lede
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          find lede/bin/targets/qualcommbe/ipq53xx -maxdepth 1 -type f \
            \( -name '*squashfs*' -o -name '*.manifest' -o -name 'sha256sums' \) \
            -exec cp {} out/ \;
          ls -lh out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: lede-jdcloud-be6500
          path: out/
          if-no-files-found: error
          retention-days: 14
